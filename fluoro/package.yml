  - trigger: .prcepi
    replace: |
      FLUOROSCOPY GUIDED EPIDURAL INJECTION PROCEDURE REPORT
  
      Patient was consented and understands the risks and benefits. Specific risks include failure to relieve pain, increased pain, bleeding/infection, nerve damage.
  
      DIAGNOSIS/INDICATION: Cervicalgia, cervical radiculopathy
  
      LOCATION: C7/T1
  
      SKIN PREP: ChloraPrep
  
      ANESTHESIA: local anesthesia with 1% lidocaine
  
      NEEDLE USED: 18 gauge Tuohy 3.5 inch
  
      POSITION: prone
  
      SOLUTION: Leukocyte-Poor Autologous Platelet-rich plasma
  
      TECHNIQUE: After obtaining informed consent, platelet-rich plasma was harvested from the patient and centrifuged at 1100 RCF for ten minutes. The patient was placed on the procedure table in the prone position. Time out was performed. The cervical area was prepped and draped in the usual  sterile fashion. Using fluoroscopic guidance, the skin and soft tissue overlying the C7-T1 area was anesthetized with 1% lidocaine. Under fluoroscopic guidance using AP, contralateral oblique, and oblique views, a 17-gauge 3.5 inch Tuohy needle was advanced to the posterior aspect of the T1 lamina and redirected cephalad to engage the ligamentum flavum. Loss of resistance was achieved. Omnipaque injection demonstrated good epidural spread. The harvested platelet-rich plasma was then injected. The needle was removed. The patient tolerated the procedure well. There were no immediate complications.
  
      ESTIMATED BLOOD LOSS: None
  
      SPECIMENS: None
  
      OUTCOME: Patient tolerated procedure well and was moved to recovery for further monitoring. Discharge instructions were given.
  - trigger: .prlepi
    replace: |
      FLUOROSCOPY GUIDED EPIDURAL INJECTION PROCEDURE REPORT
  
      Patient was consented and understands the risks and benefits. Specific risks include failure to relieve pain, increased pain, bleeding/infection, nerve damage.
  
      DIAGNOSIS/INDICATION: Lumbar Radiculopathy
  
      LOCATION: L5/S1
  
      SKIN PREP: ChloraPrep
  
      ANESTHESIA: local anesthesia with 1% lidocaine
  
      NEEDLE USED: 18 gauge Tuohy 3.5 inch
  
      POSITION: prone
  
      SOLUTION: Leukocyte-Poor Autologous Platelet-rich plasma
  
      TECHNIQUE: After obtaining informed consent, platelet-rich plasma was harvested from the patient and centrifuged at 1100 RCF for ten minutes. The patient was placed on the procedure table in the prone position. Time out was performed. The standard monitors were placed. The patient was prepped and draped in the usual sterile fashion. The L5-S1 interspace was identified by fluoroscopy. Next 5 cc of lidocaine 1% was injected into the skin and along the targeted needle track. Then an 18-gauge Tuohy needle was inserted through the anesthetized skin and slowly advanced while constantly monitoring for any change in resistance via syringe filled with preservative-free normal saline. Loss of resistance was appreciated immediately upon entry of the Tuohy needle tip into the epidural space. No blood, CSF or paresthesias were elicited. An epidurogram with Omnipaque confirmed correct placement of the needle and appropriate spread of the contrast solution. The harvested platelet-rich plasma was then injected. Fluoroscopy demonstrated appropriate washout of the contrast medium to confirm therapeutic spread, after which the Tuohy needle was easily removed. The patient tolerated the procedure well. There were no immediate complications.
  
      ESTIMATED BLOOD LOSS: None
  
      SPECIMENS: None
  
      OUTCOME: Patient tolerated procedure well and was moved to recovery for further monitoring. Discharge instructions were given.
