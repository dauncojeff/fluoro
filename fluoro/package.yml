    - name: pain_list
      type: shell
      params:
        shell: bash
        cmd: |-
          count=0
          add_item() { item="$1"; [ -z "$item" ] && return; [ "$item" = "none" ] && return; case "|$seen|" in *"|$item|"*) return ;; esac; seen="${seen}|${item}"; count=$((count+1)); printf -v "v$count" '%s' "$item"; }
          [ "$ESPANSO_NP1_INCLUDE_NECK" = "yes" ] && add_item "neck"
          [ "$ESPANSO_NP2_INCLUDE_MID_BACK" = "yes" ] && add_item "mid-back"
          [ "$ESPANSO_NP2_INCLUDE_LOW_BACK" = "yes" ] && add_item "low back"
          for item in "$ESPANSO_NP3_EXTREMITY1" "$ESPANSO_NP3_EXTREMITY2" "$ESPANSO_NP3_EXTREMITY3" "$ESPANSO_NP3_EXTREMITY4"; do [ "$item" = "other/custom" ] && item="$ESPANSO_NP3_CUSTOM_EXTREMITY"; add_item "$item"; done
          if [ "$count" -eq 0 ]; then printf "%s" "XXX"; elif [ "$count" -eq 1 ]; then printf "%s" "$v1"; elif [ "$count" -eq 2 ]; then printf "%s and %s" "$v1" "$v2"; else out=""; i=1; while [ "$i" -le "$count" ]; do var="v$i"; item="${!var}"; if [ "$i" -eq 1 ]; then out="$item"; elif [ "$i" -eq "$count" ]; then out="$out, and $item"; else out="$out, $item"; fi; i=$((i+1)); done; printf "%s" "$out"; fi
    - name: pain_sections
      type: shell
      params:
        shell: bash
        cmd: |-
          format_list() { count="$1"; shift; case "$count" in 0) printf "" ;; 1) printf "%s" "$1" ;; 2) printf "%s and %s" "$1" "$2" ;; 3) printf "%s, %s, and %s" "$1" "$2" "$3" ;; 4) printf "%s, %s, %s, and %s" "$1" "$2" "$3" "$4" ;; 5) printf "%s, %s, %s, %s, and %s" "$1" "$2" "$3" "$4" "$5" ;; 6) printf "%s, %s, %s, %s, %s, and %s" "$1" "$2" "$3" "$4" "$5" "$6" ;; esac; }
          build_list() { count=0; seen=""; for item in "$@"; do [ -z "$item" ] && continue; [ "$item" = "none" ] && continue; case "|$seen|" in *"|$item|"*) continue ;; esac; seen="${seen}|${item}"; count=$((count+1)); printf -v "v$count" '%s' "$item"; done; format_list "$count" "$v1" "$v2" "$v3" "$v4" "$v5" "$v6"; }
          suffix() { case "$1" in none|"") printf "" ;; *) printf " with %s" "$1" ;; esac; }
          # Each spinal area uses only its own MRI status. Traveling always uses traveling wording; axial uses axial wording only when the corresponding spinal MRI is present, otherwise some-radiation wording.
          cervical_mri=0; thoracic_mri=0; lumbar_mri=0
          for m in "$ESPANSO_NP4_MRI1" "$ESPANSO_NP4_MRI2" "$ESPANSO_NP4_MRI3" "$ESPANSO_NP4_MRI4"; do
            case "$m" in
              Cervical) cervical_mri=1 ;;
              Thoracic) thoracic_mri=1 ;;
              Lumbar) lumbar_mri=1 ;;
              other/custom)
                case "$ESPANSO_NP4_CUSTOM_MRI" in
                  *Cervical*|*cervical*) cervical_mri=1 ;;
                  *Thoracic*|*thoracic*) thoracic_mri=1 ;;
                  *Lumbar*|*lumbar*) lumbar_mri=1 ;;
                esac
                ;;
            esac
          done
          neck_dest="$(build_list "$ESPANSO_NP1_NECK_RADIATION1" "$ESPANSO_NP1_NECK_RADIATION2" "$ESPANSO_NP1_NECK_RADIATION3" "$ESPANSO_NP1_NECK_RADIATION4")"
          low_dest="$(build_list "$ESPANSO_NP2_LOW_RADIATION1" "$ESPANSO_NP2_LOW_RADIATION2" "$ESPANSO_NP2_LOW_RADIATION3" "$ESPANSO_NP2_LOW_RADIATION4")"
          neck_suffix="$(suffix "$ESPANSO_NP1_NECK_RADIATION_SYMPTOMS")"; mid_suffix="$(suffix "$ESPANSO_NP2_MID_RADIATION_SYMPTOMS")"; low_suffix="$(suffix "$ESPANSO_NP2_LOW_RADIATION_SYMPTOMS")"
          symptom_list() { target="$1"; count=0; for pair in "memory loss:$ESPANSO_NP1_MEMORY_LOSS_STATUS" "dizziness:$ESPANSO_NP1_DIZZINESS_STATUS" "nausea:$ESPANSO_NP1_NAUSEA_STATUS" "headaches:$ESPANSO_NP1_HEADACHES_STATUS" "blurry vision:$ESPANSO_NP1_BLURRY_VISION_STATUS" "tinnitus-like symptoms:$ESPANSO_NP1_TINNITUS_STATUS"; do symptom="${pair%%:*}"; state="${pair#*:}"; if [ "$state" = "$target" ]; then count=$((count+1)); printf -v "s$count" '%s' "$symptom"; fi; done; format_list "$count" "$s1" "$s2" "$s3" "$s4" "$s5" "$s6"; }
          denied="$(symptom_list denied)"; reported="$(symptom_list reported)"; neuro=""
          if [ -n "$denied" ] && [ -n "$reported" ]; then neuro=" Patient denies $denied, but reports experiencing $reported."; elif [ -n "$denied" ]; then neuro=" Patient denies $denied."; elif [ -n "$reported" ]; then neuro=" Patient reports experiencing $reported."; fi
          qol=""
          case "$ESPANSO_NP2_QUALITY_OF_LIFE" in
           "restful sleep") qol="The patient states that pain interferes with restful sleep and reports increasing fatigue and frustration related to ongoing sleep disturbance." ;;
           "parenting and childcare responsibilities") qol="The patient reports difficulty performing routine parenting and childcare responsibilities due to ongoing pain, which interfere with the ability to care for, supervise, and engage in activities with his child(ren)." ;;
           "work-related duties") qol="The patient reports increasing difficulty performing work-related duties due to ongoing pain and physical limitations, which have begun to interfere with his ability to meet daily job demands." ;;
           "physical activity") qol="The patient reports ongoing difficulty with physical activity, noting that even mild exertion results in pain and fatigue. This has limited their functional capacity and affected daily routines." ;;
           "school-related activities") qol="The patient reports increasing difficulty participating in school-related activities due to ongoing pain, which have negatively affected academic performance and participation in daily educational tasks." ;;
           "anxiety and emotional distress while driving") qol="The patient reports significant anxiety and emotional distress while driving, which affects his ability to safely and independently perform activities of daily living." ;;
          esac
          count=0; full=""
          append_section() { first="$1"; lower="$2"; count=$((count+1)); case "$count" in 1) sec="$first" ;; 2) sec="In addition, $lower" ;; *) sec="To continue, $lower" ;; esac; [ -z "$full" ] && full="$sec" || full="$full $sec"; }
          if [ "$ESPANSO_NP1_INCLUDE_NECK" = "yes" ]; then
           d="$ESPANSO_NP1_NECK_DESCRIPTOR"
           if [ "$ESPANSO_NP1_NECK_PATTERN" = "traveling" ]; then first="Patient describes his neck pain as $d and traveling to his $neck_dest in a radicular fashion$neck_suffix, noting that the pain limits his $ESPANSO_NP1_NECK_LIMITATION.$neuro"; lower="patient describes his neck pain as $d and traveling to his $neck_dest in a radicular fashion$neck_suffix, noting that the pain limits his $ESPANSO_NP1_NECK_LIMITATION.$neuro";
           elif [ "$cervical_mri" -eq 1 ]; then first="Patient describes his neck pain as $d and axial$neck_suffix, noting that the pain limits his $ESPANSO_NP1_NECK_LIMITATION.$neuro"; lower="patient describes his neck pain as $d and axial$neck_suffix, noting that the pain limits his $ESPANSO_NP1_NECK_LIMITATION.$neuro";
           else first="Patient describes his neck pain as $d and notes some radiation to his $neck_dest$neck_suffix, noting that the pain limits his $ESPANSO_NP1_NECK_LIMITATION.$neuro"; lower="patient describes his neck pain as $d and notes some radiation to his $neck_dest$neck_suffix, noting that the pain limits his $ESPANSO_NP1_NECK_LIMITATION.$neuro"; fi
           append_section "$first" "$lower"
          fi
          if [ "$ESPANSO_NP2_INCLUDE_MID_BACK" = "yes" ]; then
           d="$ESPANSO_NP2_MID_DESCRIPTOR"; dest="$ESPANSO_NP2_MID_DESTINATION"
           if [ "$ESPANSO_NP2_MID_PATTERN" = "traveling" ]; then phrase="$d and traveling to his $dest";
           elif [ "$thoracic_mri" -eq 1 ]; then phrase="$d and axial";
           else phrase="$d and notes some radiation to his $dest"; fi
           append_section "Patient describes his mid-back pain as $phrase$mid_suffix, citing that the pain interferes with his $ESPANSO_NP2_MID_LIMITATION." "patient describes his mid-back pain as $phrase$mid_suffix, citing that the pain interferes with his $ESPANSO_NP2_MID_LIMITATION."
          fi
          if [ "$ESPANSO_NP2_INCLUDE_LOW_BACK" = "yes" ]; then
           d="$ESPANSO_NP2_LOW_DESCRIPTOR"
           if [ "$ESPANSO_NP2_LOW_PATTERN" = "traveling" ]; then first="Patient characterizes his low back pain as $d and traveling to his $low_dest in a radicular fashion$low_suffix, stating that the pain affects his $ESPANSO_NP2_LOW_LIMITATION."; lower="patient characterizes his low back pain as $d and traveling to his $low_dest in a radicular fashion$low_suffix, stating that the pain affects his $ESPANSO_NP2_LOW_LIMITATION.";
           elif [ "$lumbar_mri" -eq 1 ]; then first="Patient characterizes his low back pain as $d and axial$low_suffix, stating that the pain affects his $ESPANSO_NP2_LOW_LIMITATION."; lower="patient characterizes his low back pain as $d and axial$low_suffix, stating that the pain affects his $ESPANSO_NP2_LOW_LIMITATION.";
           else first="Patient characterizes his low back pain as $d and notes some radiation to his $low_dest$low_suffix, stating that the pain affects his $ESPANSO_NP2_LOW_LIMITATION."; lower="patient characterizes his low back pain as $d and notes some radiation to his $low_dest$low_suffix, stating that the pain affects his $ESPANSO_NP2_LOW_LIMITATION."; fi
           [ -n "$qol" ] && first="$first $qol" && lower="$lower $qol"; append_section "$first" "$lower"
          fi
          ext="$(build_list "$ESPANSO_NP3_EXTREMITY1" "$ESPANSO_NP3_EXTREMITY2" "$ESPANSO_NP3_EXTREMITY3" "$ESPANSO_NP3_EXTREMITY4")"
          # Replace custom option if present.
          case "$ext" in *other/custom*) ext="${ext//other\/custom/$ESPANSO_NP3_CUSTOM_EXTREMITY}" ;; esac
          if [ -n "$ext" ]; then sec="Additionally, patient reports his $ext pain as $ESPANSO_NP3_EXTREMITY_DESCRIPTOR, detailing his pain impairs his functional mobility."; [ -z "$full" ] && full="$sec" || full="$full $sec"; fi
          printf "%s" "$full"
    - name: mri_list
      type: shell
      params:
        shell: bash
        cmd: |
          count=0
          add_mri() {
            item="$1"
            [ "$item" = "none" ] && return
            [ -z "$item" ] && return
            [ "$item" = "other/custom" ] && item="$ESPANSO_NP4_CUSTOM_MRI"
            case "|$seen|" in *"|$item|"*) return ;; esac
            seen="${seen}|${item}"
            count=$((count + 1))
            case "$count" in
              1) m1="$item" ;;
              2) m2="$item" ;;
              3) m3="$item" ;;
              4) m4="$item" ;;
            esac
          }
          add_mri "$ESPANSO_NP4_MRI1"
          add_mri "$ESPANSO_NP4_MRI2"
          add_mri "$ESPANSO_NP4_MRI3"
          add_mri "$ESPANSO_NP4_MRI4"
          all_spine=1
          index=1
          while [ "$index" -le "$count" ]; do
            var="m$index"; item="${!var}"
            case "$item" in Cervical|Thoracic|Lumbar) ;; *) all_spine=0 ;; esac
            index=$((index + 1))
          done
          add_spine_label() {
            case "$1" in Cervical|Thoracic|Lumbar) printf "%s Spine" "$1" ;; *) printf "%s" "$1" ;; esac
          }
          if [ "$all_spine" -eq 1 ] && [ "$count" -gt 0 ]; then
            case "$count" in
              1) printf "%s Spine" "$m1" ;;
              2) printf "%s and %s Spine" "$m1" "$m2" ;;
              3) printf "%s, %s, and %s Spine" "$m1" "$m2" "$m3" ;;
              4) printf "%s, %s, %s, and %s Spine" "$m1" "$m2" "$m3" "$m4" ;;
            esac
          else
            [ "$count" -ge 1 ] && f1="$(add_spine_label "$m1")"
            [ "$count" -ge 2 ] && f2="$(add_spine_label "$m2")"
            [ "$count" -ge 3 ] && f3="$(add_spine_label "$m3")"
            [ "$count" -ge 4 ] && f4="$(add_spine_label "$m4")"
            case "$count" in
              0) printf "%s" "" ;;
              1) printf "%s" "$f1" ;;
              2) printf "%s and %s" "$f1" "$f2" ;;
              3) printf "%s, %s, and %s" "$f1" "$f2" "$f3" ;;
              4) printf "%s, %s, %s, and %s" "$f1" "$f2" "$f3" "$f4" ;;
            esac
          fi
    - name: tried_failed_list
      type: shell
      params:
        shell: bash
        cmd: |-
          names=("opioid medications" "anti-inflammatories" "anti-depressants" "muscle relaxants" "injections" "surgery" "non-opioid analgesics" "NSAIDs" "rest" "ice/heat" "conservative therapy" "home exercise")
          states=("$ESPANSO_NP5_THERAPY1" "$ESPANSO_NP5_THERAPY2" "$ESPANSO_NP5_THERAPY3" "$ESPANSO_NP5_THERAPY4" "$ESPANSO_NP5_THERAPY5" "$ESPANSO_NP5_THERAPY6" "$ESPANSO_NP5_THERAPY7" "$ESPANSO_NP5_THERAPY8" "$ESPANSO_NP5_THERAPY9" "$ESPANSO_NP5_THERAPY10" "$ESPANSO_NP5_THERAPY11" "$ESPANSO_NP5_THERAPY12")
          count=0
          for i in "${!names[@]}"; do if [ "${states[$i]}" = "present" ]; then count=$((count+1)); printf -v "v$count" '%s' "${names[$i]}"; fi; done
          if [ "$count" -eq 0 ]; then printf ""; elif [ "$count" -eq 1 ]; then printf "%s" "$v1"; elif [ "$count" -eq 2 ]; then printf "%s and %s" "$v1" "$v2"; else out=""; i=1; while [ "$i" -le "$count" ]; do var="v$i"; item="${!var}"; if [ "$i" -eq 1 ]; then out="$item"; elif [ "$i" -eq "$count" ]; then out="$out, and $item"; else out="$out, $item"; fi; i=$((i+1)); done; printf "%s" "$out"; fi
    - name: history_text
      type: shell
      params:
        shell: bash
        cmd: |-
          text=""
          append() { [ -z "$1" ] && return; [ -z "$text" ] && text="$1" || text="$text $1"; }
          if [ "$ESPANSO_NP3_FACILITY" != "none" ]; then append "Following the accident, patient presented to $ESPANSO_NP3_FACILITY where he $ESPANSO_NP3_FACILITY_ACTION."; fi
          if [ -n "$ESPANSO_MRI_LIST" ]; then append "Patient received MRIs of his $ESPANSO_MRI_LIST to further evaluate his condition."; fi
          therapy="$ESPANSO_NP4_CURRENT_THERAPY"; [ "$therapy" = "other" ] && therapy="$ESPANSO_NP4_CUSTOM_THERAPY"
          if [ "$ESPANSO_NP4_CURRENT_THERAPY" != "none" ] && [ -n "$therapy" ]; then append "Moreover, patient $ESPANSO_NP4_THERAPY_STATUS $therapy, citing $ESPANSO_NP4_RELIEF relief."; fi
          if [ "$ESPANSO_NP4_TAKING_MEDICATION" = "yes" ]; then append "Furthermore, patient reports taking $ESPANSO_NP4_MEDICATIONS to help manage his pain."; fi
          if [ -n "$ESPANSO_TRIED_FAILED_LIST" ]; then append "The patient has tried $ESPANSO_TRIED_FAILED_LIST. These therapies have not provided significant relief of symptoms."; fi
          printf "%s" "$text"
    - name: closing_blocks
      type: shell
      params:
