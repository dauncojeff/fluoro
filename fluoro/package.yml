  - trigger: ".prxancbp"
    replace: |
      CERVICAL EPIDURAL BLOOD PATCH INJECTION PROCEDURE REPORT
      
      Patient was consented and understands the risks and benefits. Specific risks include failure to relieve pain, increased pain, bleeding/infection, nerve damage, steroid reaction/effects.
      
      DIAGNOSIS/INDICATION: Intracranial hypotension headache caused by cerebrospinal fluid leak
      
      LOCATION: T1-T2
      
      SKIN PREP: ChloraPrep
      
      ANESTHESIA: local anesthesia with 1% lidocaine
      
      NEEDLE USED: 18 gauge Tuohy 3.5 inch
      
      POSITION: prone
      
      SOLUTION: 10 mL autologous blood
      
      PRE-OPERATIVE: Patient wished to discuss medications to help manage pre-procedural anxiety. #mg Alprazolam, #mg Diazepam, #mg Midazolam was/were administered orally to patient 30 minutes prior to procedure. XXX tablets of excess 0.5 mg Alprazolam were discarded per DEA protocol. Vitals signs were stable and continuously monitored. 
      Blood Pressure: XXX 
      Pulse: XXX
      
      TECHNIQUE: After obtaining informed consent, the patient was placed on the procedure table in the prone position. The standard monitors were placed. The patient was prepped and draped in the usual sterile fashion. 10 mL of autologous blood was drawn from a suitable vein. The T1-T2 interspace was identified by fluoroscopy. Next 5 cc of lidocaine 1% was injected into the skin and along the targeted needle track. Time out was performed. Then an 18-gauge Tuohy needle was inserted through the anesthetized skin and slowly advanced while constantly monitoring for any change in resistance via syringe filled with preservative-free normal saline. Loss of resistance was appreciated immediately upon entry of the Tuohy needle tip into the epidural space. No blood, CSF or paresthesias were elicited. An epidurogram with Omnipaque confirmed correct placement of the needle and appropriate spread of the contrast solution. Then the 10 mL of autologous blood was injected slowly and without difficulty. The Tuohy needle was easily removed. The patient tolerated the procedure well. There were no immediate complications.
      
      ESTIMATED BLOOD LOSS: None
      
      SPECIMENS: None
      
      OUTCOME: Patient tolerated procedure well and was moved to recovery for further monitoring. Patient's vitals were stable and continuously monitored for 30 minutes post-procedure. Patient was then discharged after confirmation of a driver present for patient's transportation.

