      Patient was consented and understands the risks and benefits. Specific risks include failure to relieve pain, increased pain, bleeding/infection, nerve damage, steroid reaction/effects.
  
      DIAGNOSIS/INDICATION: Intracranial hypotension headache caused by cerebrospinal fluid leak
  
      LOCATION: T1-T2
  
      SKIN PREP: ChloraPrep
  
      ANESTHESIA: local anesthesia with 1% lidocaine
  
      NEEDLE USED: 18 gauge Tuohy 3.5 inch
  
