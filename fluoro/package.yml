          add_recommendation "$ESPANSO_PLAN_INFO_RECOMMENDATION2"
          add_recommendation "$ESPANSO_PLAN_INFO_RECOMMENDATION3"
          add_recommendation "$ESPANSO_PLAN_INFO_RECOMMENDATION4"
