  - trigger: .mmfol
    replace: |
      Interval {{output}}: XXX presents today for a tele-health follow-up appointment. Patient reports that his {{pain_list}} pain continues to be present and {{hpi.pain_status}}, citing the pain as limiting his {{hpi.limitation}}. As such, {{plan_text}} No other changes to patient's pain at this time.
    vars:
    - name: output
      type: shell
      params:
        cmd: date +'%m-%d-%Y'
        shell: bash
    - name: hpi
      type: form
      params:
        layout: |-
          Primary pain area:
          [[pain1]]
          Additional pain area 1:
          [[pain2]]
          Additional pain area 2:
          [[pain3]]
          Additional pain area 3:
          [[pain4]]
          Custom pain area (used only when "other/custom" is selected):
          [[custom_pain]]
          Pain status:
          [[pain_status]]
          Limitation:
          [[limitation]]
          Recommendation 1:
          [[recommendation1]]
          Recommendation 2:
          [[recommendation2]]
          Recommendation 3:
          [[recommendation3]]
          Recommendation 4:
          [[recommendation4]]
          Referral to (used only when "referral" is selected):
          [[referral_target]]
          Current conservative therapy:
          [[current_therapy]]
          Other therapy (used only when "other" is selected):
          [[custom_therapy]]
          Therapy status:
          [[therapy_status]]
          Frequency per week:
          [[frequency]]
          Relief from therapy:
          [[relief]]
        fields:
          pain1:
            type: choice
            values:
            - neck
            - low back
            - mid-back
            - right shoulder
            - left shoulder
            - right knee
            - left knee
            - right wrist
            - left wrist
            - other/custom
          pain2:
            type: choice
            values:
            - none
            - neck
            - low back
            - mid-back
            - right shoulder
            - left shoulder
            - right knee
            - left knee
            - right wrist
            - left wrist
            - other/custom
          pain3:
            type: choice
            values:
            - none
            - neck
            - low back
            - mid-back
            - right shoulder
            - left shoulder
            - right knee
            - left knee
            - right wrist
            - left wrist
            - other/custom
          pain4:
            type: choice
            values:
            - none
            - neck
            - low back
            - mid-back
            - right shoulder
            - left shoulder
            - right knee
            - left knee
            - right wrist
            - left wrist
            - other/custom
          custom_pain:
            default: XXX
          pain_status:
            type: choice
            values:
            - debilitating
            - bothersome
          limitation:
            type: choice
            values:
            - ability to perform activities of daily living
            - overall range of motion
            - functional mobility
            - daily functioning
          recommendation1:
            type: choice
            values: &id001
            - injection
            - medications
            - conservative
            - diagnostics
            - referral
            - none
          recommendation2:
            type: choice
            values:
            - none
            - injection
            - medications
            - conservative
            - diagnostics
            - referral
          recommendation3:
            type: choice
            values:
            - none
            - injection
            - medications
            - conservative
            - diagnostics
            - referral
          recommendation4:
            type: choice
            values:
            - none
            - injection
            - medications
            - conservative
            - diagnostics
            - referral
          referral_target:
            default: XXX
          current_therapy:
            type: choice
            values: &id002
            - none
            - chiropractic therapy
            - acupuncture therapy
            - massage therapy
            - physical therapy
            - other
          custom_therapy:
            default: XXX therapy
          therapy_status:
            type: choice
            values: &id003
            - continues to partake in
            - partook in
            - completed
            - stopped
          frequency:
            type: choice
            values:
            - '1'
            - '2'
            - '3'
            - '4'
            - '5'
          relief:
            type: choice
            values: &id004
            - some
            - temporary
    - name: pain_list
      type: shell
      params:
        cmd: |
          count=0
          add_pain() {
            item="$1"
            [ "$item" = "none" ] && return
            [ -z "$item" ] && return
            [ "$item" = "other/custom" ] && item="$ESPANSO_HPI_CUSTOM_PAIN"
            case "|$seen|" in *"|$item|"*) return ;; esac
            seen="${seen}|${item}"
            count=$((count + 1))
            case "$count" in
              1) p1="$item" ;;
              2) p2="$item" ;;
              3) p3="$item" ;;
              4) p4="$item" ;;
            esac
          }
          add_pain "$ESPANSO_HPI_PAIN1"
          add_pain "$ESPANSO_HPI_PAIN2"
          add_pain "$ESPANSO_HPI_PAIN3"
          add_pain "$ESPANSO_HPI_PAIN4"
          case "$count" in
            0) printf "%s" "XXX" ;;
            1) printf "%s" "$p1" ;;
            2) printf "%s and %s" "$p1" "$p2" ;;
            3) printf "%s, %s, and %s" "$p1" "$p2" "$p3" ;;
            4) printf "%s, %s, %s, and %s" "$p1" "$p2" "$p3" "$p4" ;;
          esac
        shell: bash
    - name: plan_text
      type: shell
      params:
        cmd: |
          count=0
          procedure=""
          is_spinal=0
          case "$procedure" in
            *Cervical*|*Thoracic*|*Lumbar*|*Sacroiliac*) is_spinal=1 ;;
          esac
          add_recommendation() {
            choice="$1"
            [ "$choice" = "none" ] && return
            [ -z "$choice" ] && return
            case "|$seen|" in *"|$choice|"*) return ;; esac
            seen="${seen}|${choice}"
            case "$choice" in
              injection)
                if [ "$is_spinal" -eq 1 ]; then subject="repeat injection therapies"; else subject="injection therapies"; fi
                goal="provide effective, long-lasting relief" ;;
              medications) subject="medications"; goal="help manage pain" ;;
              conservative) subject="conservative therapies"; goal="help manage pain" ;;
              diagnostics) subject="diagnostics"; goal="further evaluate the patient's condition" ;;
              referral) subject="referral to $ESPANSO_HPI_REFERRAL_TARGET"; goal="further evaluate the patient's condition" ;;
            esac
            count=$((count + 1))
            case "$count" in
              1) s1="$subject"; g1="$goal" ;;
              2) s2="$subject"; g2="$goal" ;;
              3) s3="$subject"; g3="$goal" ;;
              4) s4="$subject"; g4="$goal" ;;
            esac
          }
          add_recommendation "$ESPANSO_HPI_RECOMMENDATION1"
          add_recommendation "$ESPANSO_HPI_RECOMMENDATION2"
          add_recommendation "$ESPANSO_HPI_RECOMMENDATION3"
          add_recommendation "$ESPANSO_HPI_RECOMMENDATION4"
          case "$count" in
            0) recommendation_text="" ;;
            1)
              case "$s1" in referral\ to\ *) recommendation_text="$s1 was discussed to $g1." ;; *) recommendation_text="$s1 were discussed to $g1." ;; esac ;;
            2) recommendation_text="$s1 and $s2 were discussed to $g1 and $g2, respectively." ;;
            3) recommendation_text="$s1, $s2, and $s3 were discussed to $g1; $g2; and $g3, respectively." ;;
            4) recommendation_text="$s1, $s2, $s3, and $s4 were discussed to $g1; $g2; $g3; and $g4, respectively." ;;
          esac
          therapy="$ESPANSO_HPI_CURRENT_THERAPY"
          if [ "$therapy" = "other" ]; then therapy="$ESPANSO_HPI_CUSTOM_THERAPY"; fi
          if [ "$ESPANSO_HPI_CURRENT_THERAPY" = "none" ] || [ -z "$therapy" ]; then
            printf "%s" "$recommendation_text"
          else
            therapy_text="Additionally, patient $ESPANSO_HPI_THERAPY_STATUS $therapy ($ESPANSO_HPI_FREQUENCY""x/week), citing $ESPANSO_HPI_RELIEF relief."
            if [ -n "$recommendation_text" ]; then printf "%s %s" "$recommendation_text" "$therapy_text"; else printf "%s" "$therapy_text"; fi
          fi
        shell: bash
